<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание персонажа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="character-creator">
        <!-- ЛЕВАЯ ПАНЕЛЬ - Меню настроек (НЕПРОЗРАЧНАЯ) -->
        <div class="left-panel">
            <div class="creator-header">
                <h1>Настройте внешность вашего персонажа</h1>
                <p class="subtitle">Изменения применяются в реальном времени</p>
            </div>
            
            <div class="creator-content">
                <!-- Основная информация -->
                <div class="section">
                    <h2>Основная информация</h2>
                    
                    <div class="input-group">
                        <label>Имя</label>
                        <input type="text" id="nameInput" placeholder="Введите имя" maxlength="50">
                    </div>
                    
                    <div class="input-group">
                        <label>Фамилия</label>
                        <input type="text" id="surnameInput" placeholder="Введите фамилию" maxlength="50">
                    </div>
                    
                    <div class="input-group">
                        <label>Возраст</label>
                        <input type="number" id="ageInput" value="25" min="18" max="100">
                    </div>
                </div>
                
                <!-- Внешность -->
                <div class="section">
                    <h2>Внешность</h2>
                    
                    <!-- Пол -->
                    <div class="gender-group">
                        <label>Пол</label>
                        <div class="gender-buttons">
                            <button class="gender-btn active" id="maleBtn" data-gender="0">Мужской</button>
                            <button class="gender-btn" id="femaleBtn" data-gender="1">Женский</button>
                        </div>
                    </div>
                    
                    <!-- Родители -->
                    <div class="slider-group">
                        <label>Мать (черты лица)</label>
                        <div class="slider-container">
                            <input type="range" id="motherSlider" min="0" max="45" value="21" class="slider">
                            <span class="slider-value" id="motherValue">21</span>
                        </div>
                    </div>
                    
                    <div class="slider-group">
                        <label>Отец (черты лица)</label>
                        <div class="slider-container">
                            <input type="range" id="fatherSlider" min="0" max="45" value="0" class="slider">
                            <span class="slider-value" id="fatherValue">0</span>
                        </div>
                    </div>
                    
                    <!-- Миксы -->
                    <div class="slider-group">
                        <label>Схожесть с родителями</label>
                        <div class="slider-container">
                            <input type="range" id="shapeMixSlider" min="0" max="1" step="0.01" value="0.5" class="slider">
                            <span class="slider-value" id="shapeMixValue">50%</span>
                        </div>
                    </div>
                    
                    <div class="slider-group">
                        <label>Тон кожи</label>
                        <div class="slider-container">
                            <input type="range" id="skinMixSlider" min="0" max="1" step="0.01" value="0.5" class="slider">
                            <span class="slider-value" id="skinMixValue">50%</span>
                        </div>
                    </div>
                    
                    <!-- Прическа -->
                    <div class="slider-group">
                        <label>Прическа</label>
                        <div class="slider-container">
                            <input type="range" id="hairSlider" min="0" max="36" value="0" class="slider">
                            <span class="slider-value" id="hairValue">0</span>
                        </div>
                    </div>
                    
                    <!-- Цвет волос -->
                    <div class="slider-group">
                        <label>Цвет волос</label>
                        <div class="slider-container">
                            <input type="range" id="hairColorSlider" min="0" max="63" value="0" class="slider">
                            <span class="slider-value" id="hairColorValue">0</span>
                        </div>
                    </div>
                    
                    <!-- Цвет глаз -->
                    <div class="slider-group">
                        <label>Цвет глаз</label>
                        <div class="slider-container">
                            <input type="range" id="eyeColorSlider" min="0" max="31" value="0" class="slider">
                            <span class="slider-value" id="eyeColorValue">0</span>
                        </div>
                    </div>
                </div>
                
                <!-- Кнопки -->
                <div class="button-group">
                    <button class="random-btn" id="randomBtn">🎲 Случайный персонаж</button>
                    <button class="create-btn" id="createBtn">Создать персонажа</button>
                </div>
            </div>
            
            <!-- Сообщения -->
            <div class="message" id="message"></div>
        </div>
        
        <!-- ПРАВАЯ ЧАСТЬ - ПРОЗРАЧНАЯ (видно 3D модель) -->
        <div class="right-panel">
            <!-- Здесь будет видна 3D модель из игры -->
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
